
name: Deploy WordPress Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PHP syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli
          php -l index.php
          php -l functions.php

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::110753466589:role/GitHubWordPressDeployRole
          aws-region: us-east-1
          role-skip-session-tagging: true
          action-timeout-s: 60


      - name: Deploy theme through SSM
        env:
          INSTANCE_ID: i-085b34aec7806f6f0
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["set -eu","mkdir -p /var/www/wordpress/wp-content/themes/my-custom-theme","chown -R ubuntu:ubuntu /var/www/wordpress/wp-content/themes/my-custom-theme"]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command submitted: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "SSM deployment command failed."
                exit 1
                ;;
            esac

            sleep 5
          done

          if [ "${STATUS:-}" != "Success" ]; then
            echo "SSM command did not complete successfully."
            exit 1
          fi

      - name: Health check
        run: |
          echo "SSM command completed. Add your website URL here for an HTTP health check."
