
name: Deploy WordPress Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Check the PHP files in the repository
      - name: Check PHP syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

          php -l wp-content/themes/my-custom-theme/index.php
          php -l wp-content/themes/my-custom-theme/functions.php

          if [ -f wp-content/plugins/my-custom-plugin/my-custom-plugin.php ]; then
            php -l wp-content/plugins/my-custom-plugin/my-custom-plugin.php
          fi

      # 3. Diagnose the GitHub OIDC token claims
      # This prints selected claims, never the token itself.
      - name: Debug OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          TOKEN=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          printf '%s' "$TOKEN" | cut -d '.' -f2 | python3 -c '
          import sys, json, base64
          payload = sys.stdin.read().strip()
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps({
              "iss": claims.get("iss"),
              "aud": claims.get("aud"),
              "sub": claims.get("sub"),
              "repository": claims.get("repository"),
              "ref": claims.get("ref"),
              "environment": claims.get("environment")
          }, indent=2))
          '

          unset TOKEN

      # 4. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::110753466589:role/GitHubWordPressDeployRole
          aws-region: us-east-1
          role-skip-session-tagging: true
          retry-max-attempts: 2

      # 5. Confirm that AWS authentication succeeded
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 6. Deploy the theme through AWS Systems Manager
      - name: Deploy theme through SSM
        env:
          INSTANCE_ID: i-085b34aec7806f6f0
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy WordPress theme from GitHub Actions" \
            --parameters 'commands=[
              "set -eu",
              "mkdir -p /var/www/wordpress/wp-content/themes/my-custom-theme",
              "echo SSM connection and destination directory verified"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command submitted: $COMMAND_ID"

          STATUS="Pending"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Error:Error,Output:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command did not complete successfully."
            exit 1
          fi

      # 7. Check whether the website responds
     
      - name: Website health check
        shell: bash
        run: |
          set -euo pipefail

          SITE_URL="http://98.93.178.125/"

          echo "Checking website: $SITE_URL"

          curl --fail --silent --show-error \
            --location \
            --max-time 30 \
            "$SITE_URL" \
            --output /dev/null

          echo "Website health check passed."
